# Builds the SDK for the iOS simulator on macOS: the SwiftUI and UIKit
# sources only compile on Apple platforms, so this is where they are checked.
name: iOS build

on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Conferbot \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
